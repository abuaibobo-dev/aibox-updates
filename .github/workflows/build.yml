name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v2.3.8）'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Compute version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy APK
        run: |
          mkdir -p dist
          TAG="${{ steps.ver.outputs.tag }}"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/aibox-$TAG.apk"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release create "$TAG" "dist/aibox-$TAG.apk" \
            --repo "${{ github.repository }}" \
            --title "Synaps $TAG" \
            --notes "GitHub Actions 自动构建" || \
          gh release upload "$TAG" "dist/aibox-$TAG.apk" --repo "${{ github.repository }}" --clobber

      - name: Print direct link
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          echo "直链: https://github.com/${{ github.repository }}/releases/download/$TAG/aibox-$TAG.apk"

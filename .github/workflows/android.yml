name: Build ORVYN Android APK
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle :app:assembleDebug --stacktrace --warning-mode all
        working-directory: android
      - name: Prepare direct APK downloads
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk ORVYN-v0.5.2-arm64.apk
          cp android/app/build/outputs/apk/debug/app-x86_64-debug.apk ORVYN-v0.5.2-x86_64.apk
      - uses: actions/upload-artifact@v4
        with: { name: ORVYN-Android-v0.5.2-JNI-Fix, path: android/app/build/outputs/apk/debug/*.apk }
      - name: Publish direct APK links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orvyn-v0.5.2
          name: ORVYN v0.5.2
          body: "Fixes the native hev-socks5-tunnel JNI binding. ARM64 is recommended for most Android phones."
          files: |
            ORVYN-v0.5.2-arm64.apk
            ORVYN-v0.5.2-x86_64.apk

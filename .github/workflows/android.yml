name: Build ORVYN Android APK
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle :app:assembleDebug --stacktrace --warning-mode all
        working-directory: android
      - name: Prepare direct APK downloads
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk ORVYN-v0.5.6-arm64.apk
          cp android/app/build/outputs/apk/debug/app-x86_64-debug.apk ORVYN-v0.5.6-x86_64.apk
      - uses: actions/upload-artifact@v4
        with: { name: ORVYN-Android-v0.5.6-DNS-Probe, path: android/app/build/outputs/apk/debug/*.apk }
      - name: Publish and verify direct APK links
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view orvyn-v0.5.6 >/dev/null 2>&1 || gh release create orvyn-v0.5.6 --title "ORVYN v0.5.6" --notes "Fixes mapped DNS routing and adds real SOCKS reachability, authentication and CONNECT checks."
          gh release upload orvyn-v0.5.6 ORVYN-v0.5.6-arm64.apk ORVYN-v0.5.6-x86_64.apk --clobber
          test "$(gh release view orvyn-v0.5.6 --json assets --jq '.assets | length')" -eq 2

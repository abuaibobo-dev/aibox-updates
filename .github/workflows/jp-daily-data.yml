name: JPStock Daily data refresh

on:
  schedule:
    # 14:30 UTC = 23:30 JST after Tokyo close (~15:00 JST)
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # market.sqlite holds 10y OHLCV + live fundamentals. Caching it makes the
      # daily run incremental (seconds) instead of re-fetching everything.
      - name: Restore market.sqlite cache
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: jp-stock/data/market.sqlite
          key: jpmarket-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jpmarket-${{ runner.os }}-

      - name: Run daily pipeline (incremental when cache restored)
        working-directory: jp-stock/engine
        run: python3 run_daily.py

      - name: Save market.sqlite cache
        uses: actions/cache@v4
        with:
          path: jp-stock/data/market.sqlite
          key: jpmarket-${{ runner.os }}-${{ github.run_id }}

      - name: Commit data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jp-stock/data/daily.json jp-stock/data/market.json jp-stock/data/history.json
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "chore: jp daily data refresh $(date -u +%F)"
            git push
          fi
